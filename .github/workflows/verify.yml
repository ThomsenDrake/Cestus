name: verify

on:
  pull_request:
  push:
    branches:
      - neo

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
      - name: Install PDF extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - run: npm ci
      - run: npm run verify
